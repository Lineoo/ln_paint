[workspace]
members = ["lnpaint", "lnworld"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.0-dev"

[patch.crates-io.winit]
git = "https://github.com/Lineoo/winit/"
branch = "ln_drawer"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.lnpaint]
opt-level = 0

[profile.dev.package.lnworld]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
